language = "C"
header = "/* Auto-generated by cbindgen — DO NOT EDIT */"
include_guard = "MOONLIT_REEL_CORE_H"
autogen_warning = "/* Warning: autogenerated by cbindgen. Do not modify manually. */"
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
no_includes = false
tab_width = 4
documentation = true
style = "both"   # emit both structs and typedefs

[fn]
must_use = "MR_WARN_UNUSED_RESULT"
prefix = "mr_"
postfix = ""

[struct]
rename_fields = "SnakeCase"
derive_eq     = true

[enum]
rename_variants = "ScreamingSnakeCase"

[export]
include = []
exclude = []

[parse]
parse_deps   = false
